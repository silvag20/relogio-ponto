<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio de Ponto</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #334155);
    color: #f1f5f9;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
  }
  h1 {
    margin-bottom: 5px;
    font-size: 1.8rem;
  }
  #relogio {
    font-size: 3rem;
    font-weight: bold;
    margin: 20px 0 10px;
    letter-spacing: 2px;
  }
  #data {
    font-size: 1.1rem;
    color: #cbd5e1;
    margin-bottom: 25px;
  }
  .botoes {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 30px;
  }
  button {
    padding: 14px 26px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.15s, opacity 0.15s;
  }
  button:active { transform: scale(0.96); }
  #entrada { background: #22c55e; color: #062b13; }
  #saida { background: #ef4444; color: #2b0606; }
  #limpar { background: #64748b; color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .container-tabela {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 0.95rem;
  }
  th { color: #93c5fd; }
  tr:last-child td { border-bottom: none; }
  .tipo-entrada { color: #4ade80; font-weight: 600; }
  .tipo-saida { color: #f87171; font-weight: 600; }
  #vazio {
    text-align: center;
    color: #94a3b8;
    padding: 20px 0;
  }
</style>
</head>
<body>

  <h1>⏰ Relógio de Ponto</h1>
  <div id="relogio">--:--:--</div>
  <div id="data">--</div>

  <div class="botoes">
    <button id="entrada" onclick="registrarPonto('Entrada')">Registrar Entrada</button>
    <button id="saida" onclick="registrarPonto('Saída')">Registrar Saída</button>
    <button id="limpar" onclick="limparRegistros()">Limpar histórico</button>
  </div>

  <div class="container-tabela">
    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Data</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
    <div id="vazio">Nenhum registro ainda.</div>
  </div>

<script>
  const relogioEl = document.getElementById('relogio');
  const dataEl = document.getElementById('data');
  const corpoTabela = document.getElementById('corpoTabela');
  const vazioEl = document.getElementById('vazio');

  const diasSemana = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

  function atualizarRelogio() {
    const agora = new Date();
    relogioEl.textContent = agora.toLocaleTimeString('pt-BR');
    dataEl.textContent = `${diasSemana[agora.getDay()]}, ${agora.toLocaleDateString('pt-BR')}`;
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  function carregarRegistros() {
    try {
      return JSON.parse(localStorage.getItem('registrosPonto')) || [];
    } catch {
      return [];
    }
  }

  function salvarRegistros(registros) {
    localStorage.setItem('registrosPonto', JSON.stringify(registros));
  }

  function renderizarTabela() {
    const registros = carregarRegistros();
    corpoTabela.innerHTML = '';

    if (registros.length === 0) {
      vazioEl.style.display = 'block';
      return;
    }
    vazioEl.style.display = 'none';

    registros.slice().reverse().forEach(reg => {
      const tr = document.createElement('tr');
      const classeTipo = reg.tipo === 'Entrada' ? 'tipo-entrada' : 'tipo-saida';
      tr.innerHTML = `
        <td class="${classeTipo}">${reg.tipo}</td>
        <td>${reg.data}</td>
        <td>${reg.hora}</td>
      `;
      corpoTabela.appendChild(tr);
    });
  }

  function registrarPonto(tipo) {
    const agora = new Date();
    const registros = carregarRegistros();
    registros.push({
      tipo,
      data: agora.toLocaleDateString('pt-BR'),
      hora: agora.toLocaleTimeString('pt-BR')
    });
    salvarRegistros(registros);
    renderizarTabela();
  }

  function limparRegistros() {
    if (confirm('Tem certeza que deseja apagar todo o histórico?')) {
      localStorage.removeItem('registrosPonto');
      renderizarTabela();
    }
  }

  renderizarTabela();
</script>

</body>

function horaParaMin(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function minParaHora(min){
  const neg = min < 0; min = Math.abs(Math.round(min));
  const h = Math.floor(min/60), m = min%60;
  return (neg?'-':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function horaAgora(){ return new Date().toTimeString().slice(0,5); }
function nomeMes(m){ return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m]; }
function formatBRL(v){ return 'R$ '+ (v||0).toFixed(2).replace('.',','); }
function formatDataBR(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

function calcularTrabalhadoDia(regsDoDia){
  const tipos = {};
  regsDoDia.forEach(r=>tipos[r.tipo]=r.hora);
  if(!tipos['Entrada']) return 0;
  let total = 0;
  const ent = horaParaMin(tipos['Entrada']);
  const saiInt = tipos['Saída Intervalo'] ? horaParaMin(tipos['Saída Intervalo']) : null;
  const ret = tipos['Retorno'] ? horaParaMin(tipos['Retorno']) : null;
  const sai = tipos['Saída'] ? horaParaMin(tipos['Saída']) : null;
  function diff(a,b){ let d=b-a; if(d<0) d+=24*60; return d; }
  if(saiInt!==null){
    total += diff(ent, saiInt);
    if(ret!==null && sai!==null) total += diff(ret, sai);
  } else if(sai!==null){
    total += diff(ent, sai);
  }
  return total;
}

function horasPrevistasDia(func){
  const j = func.jornada;
  const ent = horaParaMin(j.entrada), int1 = horaParaMin(j.intervaloInicio), int2 = horaParaMin(j.intervaloFim), sai = horaParaMin(j.saida);
  function diff(a,b){ let d=b-a; if(d<0) d+=24*60; return d; }
  return diff(ent,int1) + diff(int2,sai);
}

function proximoTipo(regsDoDia){
  const tipos = regsDoDia.map(r=>r.tipo);
  if(!tipos.includes('Entrada')) return 'Entrada';
  if(!tipos.includes('Saída Intervalo')) return 'Saída Intervalo';
  if(!tipos.includes('Retorno')) return 'Retorno';
  if(!tipos.includes('Saída')) return 'Saída';
  return null;
}

  };

  if(!currentUser.employeeId) return null;

function renderDashboard(){
  const emp = dbGet('employees');
  const ativos = emp.filter(e=>e.status==='Ativo');
  const hoje = hojeISO();
  const records = dbGet('records').filter(r=>r.date===hoje);
  const presentesIds = new Set(records.filter(r=>r.tipo==='Entrada').map(r=>r.employeeId));
  const ausentes = ativos.length - presentesIds.size;
  let atrasosHoje = 0;
  ativos.forEach(f=>{
    const ent = records.find(r=>r.employeeId===f.id && r.tipo==='Entrada');
    if(ent){
      const prevista = horaParaMin(f.jornada.entrada) + (dbGet('settings').toleranciaAtraso||0);
      if(horaParaMin(ent.hora) > prevista) atrasosHoje++;
    }
  });
  const mesAtual = new Date().getMonth();
  const anoAtual = new Date().getFullYear();
  let horasExtrasMes=0, horasTrabMes=0;
  ativos.forEach(f=>{
    const r = calcularResumoMensal(f, anoAtual, mesAtual);
    horasExtrasMes += r.extraMin; horasTrabMes += r.trabalhadoMin;

function calcularResumoMensal(func, ano, mes){
  const dias = new Date(ano, mes+1, 0).getDate();
  const records = dbGet('records').filter(r=>r.employeeId===func.id);
  const holidays = new Set(dbGet('holidays').map(h=>h.data));
  const settings = dbGet('settings');
  let trabalhadoMin=0, previstoMin=0, extraMin=0, atrasoMin=0, faltas=0;
  const hojeStr = hojeISO();
  for(let d=1; d<=dias; d++){
    const dataISO = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(dataISO > hojeStr) continue;
    const regsDia = records.filter(r=>r.date===dataISO);
    const tipos = {}; regsDia.forEach(r=>tipos[r.tipo]=r.hora);
    const isHoliday = holidays.has(dataISO);
    const diaSemana = new Date(dataISO+'T12:00:00').getDay();
    const prevDia = isHoliday ? 0 : horasPrevistasDia(func);
    const trabDia = calcularTrabalhadoDia(regsDia);
    trabalhadoMin += trabDia; previstoMin += prevDia;
    extraMin += Math.max(0, trabDia - prevDia);
    if(tipos['Entrada']){
      atrasoMin += Math.max(0, horaParaMin(tipos['Entrada']) - horaParaMin(func.jornada.entrada) - (settings.toleranciaAtraso||0));
    } else if(prevDia>0 && diaSemana!==0 && diaSemana!==6){
      faltas++;
    }
  }
  const valorHora = func.salario / (func.cargaMensal||220) / 60;
  const valorExtra = extraMin * valorHora * (1 + (settings.percentualExtra||50)/100);
  return {trabalhadoMin, previstoMin, extraMin, atrasoMin, faltas, valorHora, valorExtra};
}

                : `<button class="icon-btn" onclick="fecharFolha('${f.id}',${ano},${mes})">Fechar</button>`}</td>
            </tr>`;
          }).join('') || '<tr><td colspan="9" style="color:var(--cinza)">Nenhum colaborador.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
let folhaMes=null, folhaAno=null;
function fecharFolha(employeeId, ano, mes){
  if(!confirm('Confirmar fechamento da folha deste colaborador para o período? Isso bloqueará novas alterações retroativas.')) return;
  const closures = dbGet('closures');
  const func = dbGet('employees').find(e=>e.id===employeeId);
  const resumo = calcularResumoMensal(func, ano, mes);
  closures.push({id:uid(), employeeId, ano, mes, fechadoPor:currentUser.nome, data:new Date().toISOString(), resumo});
  dbSet('closures', closures);
  logAudit(`Folha fechada: ${func.nome} - ${nomeMes(mes)}/${ano}`);
  renderFolha();
}
function reabrirFolha(employeeId, ano, mes){
  if(!confirm('Reabrir esta folha? (somente administrador)')) return;
  let closures = dbGet('closures');
  const alvo = closures.find(c=>c.employeeId===employeeId && c.ano===ano && c.mes===mes);
  closures = closures.filter(c=>c!==alvo);
  dbSet('closures', closures);
  const func = dbGet('employees').find(e=>e.id===employeeId);
  logAudit(`Folha reaberta: ${func.nome} - ${nomeMes(mes)}/${ano} (por ${currentUser.nome})`);
  renderFolha();
}

function renderRelatorios(){
  document.getElementById('content').innerHTML = `
    <h1>Relatórios</h1>
    <div class="card">
      <p>Exporte os dados abaixo em formato CSV (compatível com Excel).</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-azul" onclick="exportarCSVRegistros()">📁 Relatório de Ponto (todas as marcações)</button>
        <button class="btn btn-azul" onclick="exportarCSVResumo()">📁 Relatório de Horas Trabalhadas / Extras (mês atual)</button>
        <button class="btn btn-azul" onclick="exportarCSVColaboradores()">📁 Relatório de Colaboradores</button>
      </div>
    </div>
  `;
}
function baixarCSV(nomeArq, linhas){
  const csv = linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nomeArq; a.click();
}
function exportarCSVRegistros(){
  const emp = dbGet('employees');
  const records = dbGet('records');
  const linhas = [['Colaborador','Data','Tipo','Hora','Registrado por']];
  records.forEach(r=>{
    const f = emp.find(e=>e.id===r.employeeId);
    linhas.push([f?f.nome:'?', formatDataBR(r.date), r.tipo, r.hora, r.registradoPor||'']);
  });
  baixarCSV('relatorio_ponto.csv', linhas);
}
function exportarCSVResumo(){
  const emp = dbGet('employees').filter(e=>e.status==='Ativo');
  const hoje = new Date();
  const linhas = [['Colaborador','Horas Trabalhadas','Horas Previstas','Horas Extras','Atrasos','Faltas','Valor Extra (R$)']];
  emp.forEach(f=>{
    const r = calcularResumoMensal(f, hoje.getFullYear(), hoje.getMonth());
    linhas.push([f.nome, minParaHora(r.trabalhadoMin), minParaHora(r.previstoMin), minParaHora(r.extraMin), minParaHora(r.atrasoMin), r.faltas, r.valorExtra.toFixed(2)]);
  });
  baixarCSV('relatorio_horas.csv', linhas);
}
function exportarCSVColaboradores(){
  const emp = dbGet('employees');
  const linhas = [['Nome','CPF','Matrícula','Cargo','Setor','Salário','Status','Admissão']];
  emp.forEach(e=>linhas.push([e.nome,e.cpf,e.matricula,e.cargo,e.setor,e.salario,e.status,formatDataBR(e.admissao)]));
  baixarCSV('colaboradores.csv', linhas);
}

function renderFeriados(){
  const holidays = dbGet('holidays').sort((a,b)=>a.data.localeCompare(b.data));
  document.getElementById('content').innerHTML = `
    <h1>Feriados</h1>
    <div class="card">
      <div class="form-grid" style="margin-bottom:14px">
        <div><label>Data</label><input type="date" id="novoFerData"></div>
        <div><label>Nome do feriado</label><input id="novoFerNome" placeholder="ex: Natal"></div>
      </div>
      <button class="btn btn-azul" onclick="adicionarFeriado()">+ Adicionar Feriado</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Data</th><th>Feriado</th><th></th></tr></thead>
        <tbody>${holidays.map(h=>`<tr><td>${formatDataBR(h.data)}</td><td>${h.nome}</td>
          <td><button class="icon-btn del" onclick="removerFeriado('${h.data}')">Excluir</button></td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--cinza)">Nenhum feriado cadastrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
function adicionarFeriado(){
  const data = val('novoFerData'), nome = val('novoFerNome');
  if(!data || !nome){ alert('Preencha data e nome do feriado.'); return; }
  const holidays = dbGet('holidays');
  holidays.push({data, nome});
  dbSet('holidays', holidays);
  logAudit(`Feriado cadastrado: ${nome} (${formatDataBR(data)})`);
  renderFeriados();
}
function removerFeriado(data){
  dbSet('holidays', dbGet('holidays').filter(h=>h.data!==data));
  renderFeriados();
}

function renderCorrecoes(){
  const isFunc = currentUser.role==='funcionario';
  const todas = dbGet('corrections');
  const lista = isFunc ? todas.filter(c=>c.employeeId===currentUser.employeeId) : todas;
  const emp = dbGet('employees');

  document.getElementById('content').innerHTML = `
    <h1>${isFunc?'Solicitar Correção de Ponto':'Solicitações de Correção'}</h1>
    ${isFunc ? `
    <div class="card">
      <div class="form-grid">
        <div><label>Data</label><input type="date" id="corData" value="${hojeISO()}"></div>
        <div><label>Horário correto</label><input type="time" id="corHora"></div>
        <div class="full"><label>Motivo</label><input id="corMotivo" placeholder="ex: Esqueci de registrar a saída"></div>
      </div>
      <button class="btn btn-azul" style="margin-top:12px" onclick="solicitarCorrecao()">Enviar Solicitação</button>
    </div>` : ''}
    <div class="card">
      <table>
        <thead><tr><th>${isFunc?'':'Colaborador'}</th><th>Data</th><th>Horário Solicitado</th><th>Motivo</th><th>Status</th>${!isFunc?'<th></th>':''}</tr></thead>
        <tbody>
          ${lista.map(c=>{
            const f = emp.find(e=>e.id===c.employeeId);
            const badge = c.status==='Aprovado'?'badge-verde':c.status==='Recusado'?'badge-vermelho':'badge-amarelo';
            return `<tr>${isFunc?'':'<td>'+(f?f.nome:'?')+'</td>'}<td>${formatDataBR(c.data)}</td><td>${c.horario}</td><td>${c.motivo}</td>
              <td><span class="badge ${badge}">${c.status}</span></td>
              ${!isFunc && c.status==='Pendente' ? `<td><button class="icon-btn" onclick="responderCorrecao('${c.id}','Aprovado')">Aprovar</button>
                <button class="icon-btn del" onclick="responderCorrecao('${c.id}','Recusado')">Recusar</button></td>` : (!isFunc?'<td></td>':'')}
            </tr>`;
          }).join('') || `<tr><td colspan="6" style="color:var(--cinza)">Nenhuma solicitação.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
function solicitarCorrecao(){
  const corrections = dbGet('corrections');
  corrections.push({id:uid(), employeeId:currentUser.employeeId, data:val('corData'), horario:val('corHora'), motivo:val('corMotivo'), status:'Pendente'});
  dbSet('corrections', corrections);
  logAudit(`Solicitação de correção enviada por ${currentUser.nome}`);
  renderCorrecoes();
}
function responderCorrecao(id, status){
  const corrections = dbGet('corrections');
  const c = corrections.find(x=>x.id===id); c.status = status;
  dbSet('corrections', corrections);
  logAudit(`Correção ${status.toLowerCase()} por ${currentUser.nome}`);
  renderCorrecoes();
}

function renderAuditoria(){
  const audit = dbGet('audit');
  document.getElementById('content').innerHTML = `
    <h1>Auditoria</h1>
    <div class="card">
      <table>
        <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Ação</th></tr></thead>
        <tbody>${audit.map(a=>`<tr><td>${new Date(a.data).toLocaleString('pt-BR')}</td><td>${a.usuario}</td><td>${a.acao}</td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--cinza)">Nenhum registro de auditoria.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function renderConfig(){
  const s = dbGet('settings');
  document.getElementById('content').innerHTML = `
    <h1>Configurações</h1>
    <div class="card" style="max-width:500px">
      <label>Nome da empresa</label><input id="cfgEmpresa" value="${s.empresa}">
      <label>Tolerância de atraso (minutos)</label><input id="cfgTolerancia" type="number" value="${s.toleranciaAtraso}">
      <label>Percentual de hora extra em dia normal (%)</label><input id="cfgExtra" type="number" value="${s.percentualExtra}">
      <label>Percentual de hora extra em feriado/domingo (%)</label><input id="cfgExtraFer" type="number" value="${s.percentualExtraFeriado}">
      <label>Carga horária mensal padrão</label><input id="cfgCarga" type="number" value="${s.cargaMensalPadrao}">
      <button class="btn btn-azul" style="margin-top:18px" onclick="salvarConfig()">Salvar Configurações</button>
    </div>
  `;
}
function salvarConfig(){
  const s = {
    empresa:val('cfgEmpresa'), toleranciaAtraso:parseInt(val('cfgTolerancia'))||0,
    percentualExtra:parseFloat(val('cfgExtra'))||50, percentualExtraFeriado:parseFloat(val('cfgExtraFer'))||100,
    cargaMensalPadrao:parseInt(val('cfgCarga'))||220
  };
  dbSet('settings', s);
  logAudit('Configurações do sistema atualizadas');
  alert('Configurações salvas.');
  renderConfig();
}
