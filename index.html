<script>
/* ======================================================================
   CONEXÃO COM O SUPABASE (banco de dados de verdade)
   ====================================================================== */
const SUPABASE_URL = 'https://hgiwasnyunvstlrlztmx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NA6OZSV9539QjnkKc9engg_Hshq1Jf-';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Estado local (cache em memória, sincronizado com o Supabase) */
let state = { employees:[], records:[], holidays:[], settings:{}, corrections:[], audit:[], closures:[] };
function dbGet(key){ return state[key] !== undefined ? state[key] : (key==='settings' ? {} : []); }
function dbSet(key,val){ state[key] = val; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Conversores: linha do Supabase (snake_case) <-> objeto usado nas telas (camelCase) */
function mapEmployeeFromDB(row){
  return {
    id: row.id, nome: row.nome, cpf: row.cpf, matricula: row.matricula, cargo: row.cargo, setor: row.setor,
    salario: Number(row.salario)||0, cargaMensal: row.carga_horaria_mensal||220,
    admissao: row.data_admissao, status: row.status,
    jornada: {
      entrada: (row.jornada_entrada||'08:00').slice(0,5),
      intervaloInicio: (row.jornada_intervalo_inicio||'12:00').slice(0,5),
      intervaloFim: (row.jornada_intervalo_fim||'13:00').slice(0,5),
      saida: (row.jornada_saida||'18:00').slice(0,5)
    }
  };
}
function mapRecordFromDB(row){
  return { id: row.id, employeeId: row.employee_id, date: row.data, tipo: row.tipo, hora: (row.hora||'').slice(0,5), registradoPor: row.registrado_por };
}
function mapCorrectionFromDB(row){
  return { id: row.id, employeeId: row.employee_id, data: row.data, horario: (row.horario_solicitado||'').slice(0,5), motivo: row.motivo, status: row.status };
}
function mapSettingsFromDB(row){
  return { empresa: row.empresa||'', toleranciaAtraso: row.tolerancia_atraso_min??5, percentualExtra: row.percentual_extra??50, percentualExtraFeriado: row.percentual_extra_feriado??100, cargaMensalPadrao: row.carga_mensal_padrao??220, _id: row.id };
}

/* Carrega todas as tabelas do Supabase para o estado local */
async function carregarTudo(){
  const [empRes, recRes, holRes, setRes, corRes, audRes, cloRes, usrRes] = await Promise.all([
    sb.from('employees').select('*').order('nome'),
    sb.from('time_records').select('*'),
    sb.from('holidays').select('*'),
    sb.from('settings').select('*').limit(1).maybeSingle(),
    sb.from('corrections').select('*'),
    sb.from('audit_log').select('*').order('created_at', {ascending:false}),
    sb.from('closures').select('*'),
    sb.from('profiles').select('*, employees(nome)'),
  ]);
  state.employees = (empRes.data||[]).map(mapEmployeeFromDB);
  state.records = (recRes.data||[]).map(mapRecordFromDB);
  state.holidays = (holRes.data||[]).map(h=>({data:h.data, nome:h.nome, _id:h.id}));
  state.settings = setRes.data ? mapSettingsFromDB(setRes.data) : {empresa:'',toleranciaAtraso:5,percentualExtra:50,percentualExtraFeriado:100,cargaMensalPadrao:220};
  state.corrections = (corRes.data||[]).map(mapCorrectionFromDB);
  state.audit = (audRes.data||[]).map(a=>({data:a.created_at, usuario:a.usuario_nome, acao:a.acao}));
  state.closures = (cloRes.data||[]).map(c=>({employeeId:c.employee_id, ano:c.ano, mes:c.mes, fechadoPor:c.fechado_por, data:c.fechado_em}));
  state.usuarios = (usrRes.data||[]).map(u=>({id:u.id, nome:u.nome, role:u.role, employeeId:u.employee_id, employeeNome:u.employees?u.employees.nome:null}));
}

async function logAudit(acao){
  const usuario_nome = currentUser?currentUser.nome:'Sistema';
  const { data, error } = await sb.from('audit_log').insert({usuario_nome, acao}).select().single();
  if(!error && data) state.audit.unshift({data:data.created_at, usuario:usuario_nome, acao});
}

function horaParaMin(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function minParaHora(min){
  const neg = min < 0; min = Math.abs(Math.round(min));
  const h = Math.floor(min/60), m = min%60;
  return (neg?'-':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function horaAgora(){ return new Date().toTimeString().slice(0,5); }
function nomeMes(m){ return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m]; }
function formatBRL(v){ return 'R$ '+ (v||0).toFixed(2).replace('.',','); }
function formatDataBR(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

function calcularTrabalhadoDia(regsDoDia){
  const tipos = {};
  regsDoDia.forEach(r=>tipos[r.tipo]=r.hora);
  if(!tipos['Entrada']) return 0;
  let total = 0;
  const ent = horaParaMin(tipos['Entrada']);
  const saiInt = tipos['Saída Intervalo'] ? horaParaMin(tipos['Saída Intervalo']) : null;
  const ret = tipos['Retorno'] ? horaParaMin(tipos['Retorno']) : null;
  const sai = tipos['Saída'] ? horaParaMin(tipos['Saída']) : null;
  function diff(a,b){ let d=b-a; if(d<0) d+=24*60; return d; }
  if(saiInt!==null){
    total += diff(ent, saiInt);
    if(ret!==null && sai!==null) total += diff(ret, sai);
  } else if(sai!==null){
    total += diff(ent, sai);
  }
  return total;
}

function horasPrevistasDia(func){
  const j = func.jornada;
  const ent = horaParaMin(j.entrada), int1 = horaParaMin(j.intervaloInicio), int2 = horaParaMin(j.intervaloFim), sai = horaParaMin(j.saida);
  function diff(a,b){ let d=b-a; if(d<0) d+=24*60; return d; }
  return diff(ent,int1) + diff(int2,sai);
}

function proximoTipo(regsDoDia){
  const tipos = regsDoDia.map(r=>r.tipo);
  if(!tipos.includes('Entrada')) return 'Entrada';
  if(!tipos.includes('Saída Intervalo')) return 'Saída Intervalo';
  if(!tipos.includes('Retorno')) return 'Retorno';
  if(!tipos.includes('Saída')) return 'Saída';
  return null;
}

let currentUser = null;

async function carregarPerfil(userId){
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(error || !data) return null;
  return { id: data.id, nome: data.nome, role: data.role, employeeId: data.employee_id };
}

async function fazerLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const senha = document.getElementById('loginPass').value;
  document.getElementById('loginErro').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ document.getElementById('loginErro').textContent = 'E-mail ou senha inválidos.'; return; }
  const perfil = await carregarPerfil(data.user.id);
  if(!perfil){
    document.getElementById('loginErro').textContent = 'Login ok, mas não há perfil cadastrado para este usuário na tabela "profiles".';
    await sb.auth.signOut();
    return;
  }
  currentUser = perfil;
  document.getElementById('loginErro').textContent = 'Carregando...';
  await carregarTudo();
  entrarNoApp();
}
async function fazerLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('appScreen').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}
async function verificarSessao(){
  const { data } = await sb.auth.getSession();
  if(!data.session) return;
  const perfil = await carregarPerfil(data.session.user.id);
  if(!perfil) return;
  currentUser = perfil;
  await carregarTudo();
  entrarNoApp();
}

  document.getElementById('navMenu').innerHTML = menu.map(([id,label])=>

let viewAtual = 'dashboard';
function navegar(view){
  viewAtual = view;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('ativo', el.dataset.view===view));
  document.getElementById('sidebar').classList.remove('aberta');
  const renderers = {
    dashboard: renderDashboard, ponto: renderPonto, colaboradores: renderColaboradores,
    espelho: renderEspelho, horasextras: renderHorasExtras, bancohoras: renderBancoHoras,
    atrasos: renderAtrasos, folha: renderFolha, relatorios: renderRelatorios,
    feriados: renderFeriados, correcoes: renderCorrecoes, auditoria: renderAuditoria, config: renderConfig, usuarios: renderUsuarios
  };
  (renderers[view] || renderDashboard)();
}

function meuFuncionario(){
  if(!currentUser.employeeId) return null;
  return dbGet('employees').find(e=>e.id===currentUser.employeeId);
}

function renderDashboard(){
  const emp = dbGet('employees');
  const ativos = emp.filter(e=>e.status==='Ativo');
  const hoje = hojeISO();
  const records = dbGet('records').filter(r=>r.date===hoje);
  const presentesIds = new Set(records.filter(r=>r.tipo==='Entrada').map(r=>r.employeeId));
  const ausentes = ativos.length - presentesIds.size;
  let atrasosHoje = 0;
  ativos.forEach(f=>{
    const ent = records.find(r=>r.employeeId===f.id && r.tipo==='Entrada');
    if(ent){
      const prevista = horaParaMin(f.jornada.entrada) + (dbGet('settings').toleranciaAtraso||0);
      if(horaParaMin(ent.hora) > prevista) atrasosHoje++;
    }
  });
  const mesAtual = new Date().getMonth();
  const anoAtual = new Date().getFullYear();
  let horasExtrasMes=0, horasTrabMes=0;
  ativos.forEach(f=>{
    const r = calcularResumoMensal(f, anoAtual, mesAtual);
    horasExtrasMes += r.extraMin; horasTrabMes += r.trabalhadoMin;
  });
  const closures = dbGet('closures');
  const fechadas = closures.filter(c=>c.ano===anoAtual && c.mes===mesAtual).length;

  document.getElementById('content').innerHTML = `
    <h1>Dashboard</h1>
    <div class="grid-cards">
      <div class="stat-card"><div class="num">${ativos.length}</div><div class="label">Funcionários ativos</div></div>
      <div class="stat-card"><div class="num" style="color:var(--verde)">${presentesIds.size}</div><div class="label">Presentes hoje</div></div>
      <div class="stat-card"><div class="num" style="color:var(--vermelho)">${Math.max(ausentes,0)}</div><div class="label">Ausentes hoje</div></div>
      <div class="stat-card"><div class="num" style="color:var(--amarelo)">${atrasosHoje}</div><div class="label">Atrasos hoje</div></div>
      <div class="stat-card"><div class="num">${minParaHora(horasExtrasMes)}</div><div class="label">Horas extras (mês)</div></div>
      <div class="stat-card"><div class="num">${minParaHora(horasTrabMes)}</div><div class="label">Horas trabalhadas (mês)</div></div>
      <div class="stat-card"><div class="num">${fechadas}</div><div class="label">Folhas fechadas (mês)</div></div>
      <div class="stat-card"><div class="num">${ativos.length-fechadas}</div><div class="label">Folhas em aberto</div></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Horas extras por funcionário (mês atual)</h3>
      ${ativos.map(f=>{
        const r = calcularResumoMensal(f, anoAtual, mesAtual);
        const pct = Math.min(100, (r.extraMin/60)*8);
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:3px">
            <span>${f.nome}</span><span>${minParaHora(r.extraMin)}</span>
          </div>
          <div style="background:#e2e8f0;border-radius:6px;height:8px;">
            <div style="background:var(--azul);width:${pct}%;height:8px;border-radius:6px;"></div>
          </div>
        </div>`;
      }).join('') || '<p style="color:var(--cinza)">Nenhum colaborador cadastrado.</p>'}
    </div>
  `;
}

  document.getElementById('content').innerHTML = `

        ${[...Array(12).keys()].map(m=>`<option value="${m}" ${m===mes?'selected':''}>${nomeMes(m)}</option>`).join('')}

  const dias = new Date(ano, mes+1, 0).getDate();

  const holidays = new Set(dbGet('holidays').map(h=>h.data));
  let totalTrab=0, totalPrev=0, totalExtra=0, totalAtraso=0;

  const func = dbGet('employees').find(e=>e.id===employeeId);
  const regsDia = dbGet('records').filter(r=>r.employeeId===employeeId && r.date===dataISO);

    <p style="color:var(--cinza);font-size:0.9rem;margin-top:-8px">${func?func.nome:''} — ${dia}/${mes}/${ano}</p>
    <div class="aviso" style="margin-top:10px">⚠️ Use este campo apenas para corrigir lançamentos indevidos ou esquecidos. Deixe o horário em branco para remover uma marcação. A alteração fica registrada na auditoria.</div>
    <div class="form-grid">
      <div><label>Entrada</label><input id="fpEntrada" type="time" value="${tipos['Entrada']||''}"></div>
      <div><label>Saída Intervalo</label><input id="fpSaidaInt" type="time" value="${tipos['Saída Intervalo']||''}"></div>
      <div><label>Retorno</label><input id="fpRetorno" type="time" value="${tipos['Retorno']||''}"></div>
      <div><label>Saída</label><input id="fpSaida" type="time" value="${tipos['Saída']||''}"></div>
    </div>
    <div class="modal-acoes">
      <button class="btn btn-cinza" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-azul" onclick="salvarEdicaoPonto('${employeeId}','${dataISO}')">Salvar</button>
    </div>
  `;
  abrirModal();
}
async function salvarEdicaoPonto(employeeId, dataISO){
  const func = dbGet('employees').find(e=>e.id===employeeId);
  const mapaCampos = {
    'Entrada': val('fpEntrada'),
    'Saída Intervalo': val('fpSaidaInt'),
    'Retorno': val('fpRetorno'),
    'Saída': val('fpSaida')
  };
  const regsDia = dbGet('records').filter(r=>r.employeeId===employeeId && r.date===dataISO);
  const alteracoes = [];
  for(const tipo of Object.keys(mapaCampos)){
    const novaHora = mapaCampos[tipo];
    const existente = regsDia.find(r=>r.tipo===tipo);
    if(novaHora){
      if(existente){
        if(existente.hora !== novaHora){
          const { data, error } = await sb.from('time_records').update({hora:novaHora, registrado_por: currentUser.nome}).eq('id', existente.id).select().single();
          if(error){ alert('Erro ao salvar '+tipo+': '+error.message); return; }
          const idx = state.records.findIndex(r=>r.id===existente.id);
          state.records[idx] = mapRecordFromDB(data);
          alteracoes.push(`${tipo} alterado para ${novaHora}`);
        }
      } else {
        const { data, error } = await sb.from('time_records')
          .insert({employee_id: employeeId, data: dataISO, tipo, hora: novaHora, registrado_por: currentUser.nome})
          .select().single();
        if(error){ alert('Erro ao salvar '+tipo+': '+error.message); return; }
        state.records.push(mapRecordFromDB(data));
        alteracoes.push(`${tipo} incluído às ${novaHora}`);
      }
    } else if(existente){
      const { error } = await sb.from('time_records').delete().eq('id', existente.id);
      if(error){ alert('Erro ao remover '+tipo+': '+error.message); return; }
      state.records = state.records.filter(r=>r.id!==existente.id);
      alteracoes.push(`${tipo} removido`);
    }
  }
  if(alteracoes.length){
    logAudit(`Ajuste manual de ponto de ${func?func.nome:employeeId} em ${dataISO}: ${alteracoes.join('; ')}`);
  }
  fecharModal();
  renderEspelho();
}
let espelhoFuncId=null, espelhoMes=null, espelhoAno=null;

function calcularResumoMensal(func, ano, mes){
  const dias = new Date(ano, mes+1, 0).getDate();
  const records = dbGet('records').filter(r=>r.employeeId===func.id);
  const holidays = new Set(dbGet('holidays').map(h=>h.data));
  const settings = dbGet('settings');
  let trabalhadoMin=0, previstoMin=0, extraMin=0, atrasoMin=0, faltas=0;
  const hojeStr = hojeISO();
  for(let d=1; d<=dias; d++){
    const dataISO = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(dataISO > hojeStr) continue;
    const regsDia = records.filter(r=>r.date===dataISO);
    const tipos = {}; regsDia.forEach(r=>tipos[r.tipo]=r.hora);
    const isHoliday = holidays.has(dataISO);
    const diaSemana = new Date(dataISO+'T12:00:00').getDay();
    const prevDia = isHoliday ? 0 : horasPrevistasDia(func);
    const trabDia = calcularTrabalhadoDia(regsDia);
    trabalhadoMin += trabDia; previstoMin += prevDia;
    extraMin += Math.max(0, trabDia - prevDia);
    if(tipos['Entrada']){
      atrasoMin += Math.max(0, horaParaMin(tipos['Entrada']) - horaParaMin(func.jornada.entrada) - (settings.toleranciaAtraso||0));
    } else if(prevDia>0 && diaSemana!==0 && diaSemana!==6){
      faltas++;
    }
  }
  const valorHora = func.salario / (func.cargaMensal||220) / 60;
  const valorExtra = extraMin * valorHora * (1 + (settings.percentualExtra||50)/100);
  return {trabalhadoMin, previstoMin, extraMin, atrasoMin, faltas, valorHora, valorExtra};
}

let folhaMes=null, folhaAno=null;
async function fecharFolha(employeeId, ano, mes){
  if(!confirm('Confirmar fechamento da folha deste colaborador para o período? Isso bloqueará novas alterações retroativas.')) return;
  const func = dbGet('employees').find(e=>e.id===employeeId);
  const { data, error } = await sb.from('closures')
    .insert({employee_id: employeeId, ano, mes, fechado_por: currentUser.nome})
    .select().single();
  if(error){ alert('Erro ao fechar folha: '+error.message); return; }
  state.closures.push({employeeId:data.employee_id, ano:data.ano, mes:data.mes, fechadoPor:data.fechado_por, data:data.fechado_em});
  logAudit(`Folha fechada: ${func.nome} - ${nomeMes(mes)}/${ano}`);
  renderFolha();
}
async function reabrirFolha(employeeId, ano, mes){
  if(!confirm('Reabrir esta folha? (somente administrador)')) return;
  const { error } = await sb.from('closures').delete().eq('employee_id', employeeId).eq('ano', ano).eq('mes', mes);
  if(error){ alert('Erro ao reabrir: '+error.message); return; }
  state.closures = state.closures.filter(c=>!(c.employeeId===employeeId && c.ano===ano && c.mes===mes));
  const func = dbGet('employees').find(e=>e.id===employeeId);
  logAudit(`Folha reaberta: ${func.nome} - ${nomeMes(mes)}/${ano} (por ${currentUser.nome})`);
  renderFolha();
}

function baixarCSV(nomeArq, linhas){
  const csv = linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nomeArq; a.click();
}

    const linhas = [['Colaborador','Data','Tipo','Hora','Registrado por']];
    records.forEach(r=>{
      const f = dbGet('employees').find(e=>e.id===r.employeeId);
      linhas.push([f?f.nome:'?', formatDataBR(r.date), r.tipo, r.hora, r.registradoPor||'']);
    });
    baixarCSV(`marcacao_ponto_${nomeMes(mes)}_${ano}.csv`, linhas);
  }

  if(tipo==='extras'){
    const linhas = [['Colaborador','Horas Extras','Valor Hora','% Aplicado','Valor Total (R$)']];
    funcs.forEach(f=>{
      const r = calcularResumoMensal(f, ano, mes);
      linhas.push([f.nome, minParaHora(r.extraMin), r.valorHora.toFixed(2), dbGet('settings').percentualExtra, r.valorExtra.toFixed(2)]);
    });
    baixarCSV(`horas_extras_${nomeMes(mes)}_${ano}.csv`, linhas);
  }

  if(tipo==='folha'){
    const linhas = [['Colaborador','Salário Base','Horas Trabalhadas','Horas Extras','Valor Extra (R$)','Atrasos','Faltas','Total a Pagar (R$)']];
    funcs.forEach(f=>{
      const r = calcularResumoMensal(f, ano, mes);
      const bruto = f.salario + r.valorExtra;
      linhas.push([f.nome, f.salario.toFixed(2), minParaHora(r.trabalhadoMin), minParaHora(r.extraMin), r.valorExtra.toFixed(2), minParaHora(r.atrasoMin), r.faltas, bruto.toFixed(2)]);
    });
    baixarCSV(`fechamento_folha_${nomeMes(mes)}_${ano}.csv`, linhas);
  }
}

function renderFeriados(){
  const holidays = dbGet('holidays').sort((a,b)=>a.data.localeCompare(b.data));
  document.getElementById('content').innerHTML = `
    <h1>Feriados</h1>
    <div class="card">
      <div class="form-grid" style="margin-bottom:14px">
        <div><label>Data</label><input type="date" id="novoFerData"></div>
        <div><label>Nome do feriado</label><input id="novoFerNome" placeholder="ex: Natal"></div>
      </div>
      <button class="btn btn-azul" onclick="adicionarFeriado()">+ Adicionar Feriado</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Data</th><th>Feriado</th><th></th></tr></thead>
        <tbody>${holidays.map(h=>`<tr><td>${formatDataBR(h.data)}</td><td>${h.nome}</td>
          <td><button class="icon-btn del" onclick="removerFeriado('${h.data}')">Excluir</button></td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--cinza)">Nenhum feriado cadastrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
async function adicionarFeriado(){
  const data = val('novoFerData'), nome = val('novoFerNome');
  if(!data || !nome){ alert('Preencha data e nome do feriado.'); return; }
  const { data: row, error } = await sb.from('holidays').insert({data, nome}).select().single();
  if(error){ alert('Erro ao salvar feriado: '+error.message); return; }
  state.holidays.push({data:row.data, nome:row.nome, _id:row.id});
  logAudit(`Feriado cadastrado: ${nome} (${formatDataBR(data)})`);
  renderFeriados();
}
async function removerFeriado(dataISO){
  const h = state.holidays.find(x=>x.data===dataISO);
  if(h && h._id){
    const { error } = await sb.from('holidays').delete().eq('id', h._id);
    if(error){ alert('Erro ao excluir: '+error.message); return; }
  }
  state.holidays = state.holidays.filter(x=>x.data!==dataISO);
  renderFeriados();
}

function renderCorrecoes(){
  const isFunc = currentUser.role==='funcionario';
  const todas = dbGet('corrections');
  const lista = isFunc ? todas.filter(c=>c.employeeId===currentUser.employeeId) : todas;
  const emp = dbGet('employees');

  document.getElementById('content').innerHTML = `
    <h1>${isFunc?'Solicitar Correção de Ponto':'Solicitações de Correção'}</h1>
    ${isFunc ? `
    <div class="card">
      <div class="form-grid">
        <div><label>Data</label><input type="date" id="corData" value="${hojeISO()}"></div>
        <div><label>Horário correto</label><input type="time" id="corHora"></div>
        <div class="full"><label>Motivo</label><input id="corMotivo" placeholder="ex: Esqueci de registrar a saída"></div>
      </div>
      <button class="btn btn-azul" style="margin-top:12px" onclick="solicitarCorrecao()">Enviar Solicitação</button>
    </div>` : ''}
    <div class="card">
      <table>
        <thead><tr><th>${isFunc?'':'Colaborador'}</th><th>Data</th><th>Horário Solicitado</th><th>Motivo</th><th>Status</th>${!isFunc?'<th></th>':''}</tr></thead>
        <tbody>
          ${lista.map(c=>{
            const f = emp.find(e=>e.id===c.employeeId);
            const badge = c.status==='Aprovado'?'badge-verde':c.status==='Recusado'?'badge-vermelho':'badge-amarelo';
            return `<tr>${isFunc?'':'<td>'+(f?f.nome:'?')+'</td>'}<td>${formatDataBR(c.data)}</td><td>${c.horario}</td><td>${c.motivo}</td>
              <td><span class="badge ${badge}">${c.status}</span></td>
              ${!isFunc && c.status==='Pendente' ? `<td><button class="icon-btn" onclick="responderCorrecao('${c.id}','Aprovado')">Aprovar</button>
                <button class="icon-btn del" onclick="responderCorrecao('${c.id}','Recusado')">Recusar</button></td>` : (!isFunc?'<td></td>':'')}
            </tr>`;
          }).join('') || `<tr><td colspan="6" style="color:var(--cinza)">Nenhuma solicitação.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
async function solicitarCorrecao(){
  const row = { employee_id: currentUser.employeeId, data: val('corData'), horario_solicitado: val('corHora'), motivo: val('corMotivo'), status:'Pendente' };
  const { data, error } = await sb.from('corrections').insert(row).select().single();
  if(error){ alert('Erro ao enviar solicitação: '+error.message); return; }
  state.corrections.push(mapCorrectionFromDB(data));
  logAudit(`Solicitação de correção enviada por ${currentUser.nome}`);
  renderCorrecoes();
}
async function responderCorrecao(id, status){
  const { data, error } = await sb.from('corrections').update({status}).eq('id', id).select().single();
  if(error){ alert('Erro: '+error.message); return; }
  const idx = state.corrections.findIndex(c=>c.id===id);
  if(idx>-1) state.corrections[idx] = mapCorrectionFromDB(data);
  logAudit(`Correção ${status.toLowerCase()} por ${currentUser.nome}`);
  renderCorrecoes();
}

function renderUsuarios(){
  const usuarios = dbGet('usuarios');
  const emp = dbGet('employees');
  document.getElementById('content').innerHTML = `
    <h1>Usuários e Acessos</h1>
    <div class="card">
      <h3 style="margin-top:0">Criar novo usuário</h3>
      <div class="form-grid">
        <div><label>Nome de exibição</label><input id="novoUserNome" placeholder="ex: João da Silva"></div>
        <div><label>Perfil de acesso</label>
          <select id="novoUserRole" onchange="atualizarBlocoVinculo()">
            <option value="funcionario">Funcionário</option>
            <option value="rh">RH / Gestor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div><label>E-mail de login</label><input id="novoUserEmail" type="email" placeholder="usuario@empresa.com"></div>
        <div><label>Senha provisória</label><input id="novoUserSenha" type="text" placeholder="mínimo 6 caracteres"></div>
        <div class="full" id="blocoFuncVinculado">
          <label>Vincular a qual colaborador?</label>
          <select id="novoUserFunc">
            <option value="">-- selecione --</option>
            <option value="todos">Todos os colaboradores (acesso geral, sem vínculo com um específico)</option>
            ${emp.map(e=>`<option value="${e.id}">${e.nome}</option>`).join('')}
          </select>
        </div>
      </div>
      <button class="btn btn-azul" style="margin-top:14px" onclick="criarUsuario()">+ Criar Usuário</button>
      <div class="aviso" style="margin-top:14px">⚠️ Depois de criar, avise o colaborador da senha provisória. Se o login não funcionar de primeira, veja em <b>Authentication &gt; Providers &gt; Email</b> no Supabase se a opção "Confirm email" está desativada (para não exigir confirmação por e-mail).</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Usuários cadastrados</h3>
      <table>
        <thead><tr><th>Nome</th><th>Perfil</th><th>Colaborador vinculado</th></tr></thead>
        <tbody>${usuarios.map(u=>`<tr><td>${u.nome}</td><td>${rotuloPerfil(u.role)}</td><td>${u.employeeNome || (u.role==='admin'||u.role==='rh' ? 'Todos (acesso geral)' : '-')}</td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--cinza)">Nenhum usuário cadastrado ainda.</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function atualizarBlocoVinculo(){
  const role = val('novoUserRole');
  const bloco = document.getElementById('blocoFuncVinculado');
  const select = document.getElementById('novoUserFunc');
  bloco.style.display = (role==='admin' ? 'none' : 'block');
  const opcaoTodos = select.querySelector('option[value="todos"]');
  if(opcaoTodos){
    // "Todos" só faz sentido para RH/Gestor (funcionário precisa de um colaborador específico)
    opcaoTodos.style.display = (role==='funcionario' ? 'none' : '');
    if(role==='funcionario' && select.value==='todos') select.value = '';
  }
}

async function criarUsuario(){
  const nome = val('novoUserNome');
  const role = val('novoUserRole');
  const email = val('novoUserEmail');
  const senha = val('novoUserSenha');
  const funcSelecionado = val('novoUserFunc');
  const employeeId = (funcSelecionado && funcSelecionado!=='todos') ? funcSelecionado : null;

  if(!nome || !email || !senha){ alert('Preencha nome, e-mail e senha.'); return; }
  if(senha.length < 6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }
  if(role==='funcionario' && !employeeId){ alert('Selecione o colaborador vinculado a este usuário.'); return; }
  if(role==='rh' && !funcSelecionado){ alert('Selecione um colaborador específico ou a opção "Todos os colaboradores".'); return; }

  // Cliente temporário (não guarda sessão) para criar o login sem derrubar o admin logado
  const clienteTemp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false, autoRefreshToken:false } });
  const { data, error } = await clienteTemp.auth.signUp({ email, password: senha });
  if(error){ alert('Erro ao criar login: '+error.message); return; }
  const novoId = data.user ? data.user.id : null;
  if(!novoId){ alert('Não foi possível criar o login (talvez esse e-mail já exista).'); return; }

  const { error: erroPerfil } = await sb.from('profiles').insert({ id:novoId, nome, role, employee_id: employeeId });
  if(erroPerfil){ alert('O login foi criado, mas houve erro ao salvar o perfil: '+erroPerfil.message); return; }

  const emp = dbGet('employees').find(e=>e.id===employeeId);
  state.usuarios.push({id:novoId, nome, role, employeeId, employeeNome: emp?emp.nome:null});
  logAudit(`Novo usuário criado: ${nome} (${email}) — perfil ${rotuloPerfil(role)}`);
  alert('Usuário criado com sucesso! Já pode ser usado para login.');
  renderUsuarios();
}

function renderConfig(){
  const s = dbGet('settings');
  document.getElementById('content').innerHTML = `
    <h1>Configurações</h1>
    <div class="card" style="max-width:500px">
      <label>Nome da empresa</label><input id="cfgEmpresa" value="${s.empresa}">
      <label>Tolerância de atraso (minutos)</label><input id="cfgTolerancia" type="number" value="${s.toleranciaAtraso}">
      <label>Percentual de hora extra em dia normal (%)</label><input id="cfgExtra" type="number" value="${s.percentualExtra}">
      <label>Percentual de hora extra em feriado/domingo (%)</label><input id="cfgExtraFer" type="number" value="${s.percentualExtraFeriado}">
      <label>Carga horária mensal padrão</label><input id="cfgCarga" type="number" value="${s.cargaMensalPadrao}">
      <button class="btn btn-azul" style="margin-top:18px" onclick="salvarConfig()">Salvar Configurações</button>
    </div>
  `;
}
async function salvarConfig(){
  const s = {
    empresa:val('cfgEmpresa'), tolerancia_atraso_min:parseInt(val('cfgTolerancia'))||0,
    percentual_extra:parseFloat(val('cfgExtra'))||50, percentual_extra_feriado:parseFloat(val('cfgExtraFer'))||100,
    carga_mensal_padrao:parseInt(val('cfgCarga'))||220
  };
  const existeId = state.settings._id;
  const query = existeId
    ? sb.from('settings').update(s).eq('id', existeId).select().single()
    : sb.from('settings').insert(s).select().single();
  const { data, error } = await query;
  if(error){ alert('Erro ao salvar configurações: '+error.message); return; }
  state.settings = mapSettingsFromDB(data);
  logAudit('Configurações do sistema atualizadas');
  alert('Configurações salvas.');
  renderConfig();
}
